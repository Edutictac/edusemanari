# Fuentes de las que salen los temas de EduSemanari.
# Para añadir una, copia un bloque. `tipo`: grupo | canal | web.
# Las descripciones resumen cómo se presenta cada fuente; no añadir valoraciones propias.
comunidades:
  - nombre: "Comunitat EduTicTac"
    usuario: "@edutictac"
    url: "https://t.me/edutictac"
    tipo: grupo
    desde: 2026-11-02
    es: "Comunidad de docentes que comparten conocimientos y aprenden juntos."
    va: "Comunitat de docents que compartixen coneixements i aprenen junts."
  - nombre: "PortalEDU"
    usuario: "@portaledu"
    url: "https://t.me/portaledu"
    tipo: grupo
    desde: 2026-11-02
    es: "Grupo no oficial de ayuda entre iguales sobre portal.edu.gva.es."
    va: "Grup no oficial d'ajuda entre iguals sobre portal.edu.gva.es."
  - nombre: "CvTIC (no oficial)"
    usuario: "@cv_tic"
    url: "https://t.me/cv_tic"
    tipo: canal
    desde: 2026-11-02
    es: "Canal no oficial que difunde avisos y novedades TIC de la Conselleria."
    va: "Canal no oficial que difon avisos i novetats TIC de la Conselleria."
  - nombre: "AULES (Moodle GVA)"
    usuario: "@aules"
    url: "https://t.me/aules"
    tipo: grupo
    desde: 2026-11-08
    es: "Grupo altruista de ayuda sobre el uso de la plataforma Aules, solo entre profesorado. No se resuelven incidencias técnicas: para eso está el SAI."
    va: "Grup altruista d'ajuda sobre l'ús de la plataforma Aules, soles entre professorat. No es resolen incidències tècniques: per a això està el SAI."
  - nombre: "Comunitat LliureX"
    usuario: "@comunitat_lliurex"
    url: "https://t.me/comunitat_lliurex"
    tipo: grupo
    desde: 2026-11-08
    es: "Comunidad de usuarios del sistema operativo LliureX creada en la Comunitat Valenciana, para compartir conocimiento."
    va: "Comunitat d'usuaris del sistema operatiu LliureX creada a la Comunitat Valenciana, per a compartir coneixement."

oficiales:
  - nombre: "Portal Edu"
    url: "https://portal.edu.gva.es/"
    tipo: web
    es: "Portal de la Conselleria con los avisos de Aules, LliureX, ITACA, Appsedu y las webs de centro."
    va: "Portal de la Conselleria amb els avisos d'Aules, LliureX, ITACA, Appsedu i les webs de centre."
  - nombre: "LliureX"
    url: "https://portal.edu.gva.es/lliurex/"
    tipo: web
    es: "Web oficial del proyecto LliureX, con sus avisos y boletines."
    va: "Web oficial del projecte LliureX, amb els seus avisos i butlletins."
